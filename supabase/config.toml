# Local AUTH only. Never use these relaxed email quotas as production settings.
project_id = "finzi-auth"

[api]
enabled = true
port = 17321
schemas = ["api"]
extra_search_path = ["extensions"]
max_rows = 100

[db]
port = 17322
shadow_port = 17320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 17324

[storage]
enabled = true
file_size_limit = "1MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = ""

[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
token_refresh = 1000
token_verifications = 1000

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirma tu cuenta en Finzi"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Recupera tu acceso a Finzi"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirma el cambio de correo en Finzi"
content_path = "./supabase/templates/email-change.html"

[auth.sms]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
