# Hosted STAGING preparation only. Never push the relaxed local test config.
project_id = "finzi-staging"

[api]
enabled = true
schemas = ["api"]
extra_search_path = ["extensions"]
max_rows = 100

[auth]
# Closed until SMTP and the canonical HTTPS app URL are validated.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enabled = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
otp_expiry = 3600

[storage]
enabled = true
file_size_limit = "1MiB"
